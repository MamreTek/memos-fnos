name: Package and integration
on:
  push:
    branches: ['issue/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fn-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.8'
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: make APP=memos auth-test gateway-probe-test tools gateway-probe-package gateway-probe-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memos-sso-probe-candidate
          path: apps/memos/dist/gateway-probe/
          retention-days: 14
          if-no-files-found: error
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: make APP=memos check test
      - run: make APP=memos verify-image tools package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: memos-fnos-candidate
          path: apps/memos/dist/
          retention-days: 14
          if-no-files-found: error
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - run: make APP=memos integration
        env:
          MEMOS_TEST_PLATFORM: linux/${{ matrix.arch }}
